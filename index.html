<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary meta ── -->
    <title>NeoHomeo — AI-Powered Homeopathy Consultations Online</title>
    <meta name="description" content="NeoHomeo connects you with verified homeopathic doctors through AI-assisted assessments. Personalised remedies, online consultations, and doorstep delivery — all in one place." />
    <meta name="keywords" content="NeoHomeo, neohomeo, homeopathy online, homeopathic doctor India, online homeopathy consultation, AI health assessment, Dr Neo, BHMS doctor, homeopathy app India" />
    <meta name="author" content="NeoHomeo" />
    <meta name="application-name" content="NeoHomeo" />
    <meta name="theme-color" content="#0d9488" />

    <!-- ── Rich results: tell Google to use max snippet & large images ── -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- ── Canonical & hreflang ── -->
    <link rel="canonical" href="https://neohomeo.com/" />
    <link rel="alternate" hreflang="en"         href="https://neohomeo.com/" />
    <link rel="alternate" hreflang="en-IN"      href="https://neohomeo.in/" />
    <link rel="alternate" hreflang="x-default"  href="https://neohomeo.com/" />

    <!-- ── Favicon & icons ── -->
    <link rel="icon" type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon" type="image/x-icon"   href="/favicon.ico" />
    <link rel="apple-touch-icon"           href="/apple-touch-icon.png" />
    <link rel="manifest"                   href="/site.webmanifest" />

    <!-- ── Preload critical assets ── -->
    <link rel="preload" as="image" href="/hero-doctors.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Open Graph ── -->
    <meta property="og:type"           content="website" />
    <meta property="og:site_name"      content="NeoHomeo" />
    <meta property="og:url"            content="https://neohomeo.com/" />
    <meta property="og:title"          content="NeoHomeo — AI-Powered Homeopathy Consultations Online" />
    <meta property="og:description"    content="NeoHomeo connects you with verified BHMS doctors through AI-assisted assessments. Start your free assessment today." />
    <meta property="og:image"          content="https://neohomeo.com/og-image.png" />
    <meta property="og:image:width"    content="1200" />
    <meta property="og:image:height"   content="630" />
    <meta property="og:image:alt"      content="NeoHomeo — AI-Powered Homeopathy Consultations" />
    <meta property="og:locale"         content="en_IN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card"          content="summary_large_image" />
    <meta name="twitter:site"          content="@neohomeo" />
    <meta name="twitter:creator"       content="@neohomeo" />
    <meta name="twitter:title"         content="NeoHomeo — AI-Powered Homeopathy Consultations Online" />
    <meta name="twitter:description"   content="Verified BHMS doctors. Free AI assessment. Personalised remedies at your door." />
    <meta name="twitter:image"         content="https://neohomeo.com/og-image.png" />
    <meta name="twitter:image:alt"     content="NeoHomeo — AI-Powered Homeopathy" />

    <!-- ── JSON-LD: Organisation (entity anchor for Knowledge Panel) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["MedicalOrganization", "Organization"],
      "@id": "https://neohomeo.com/#organization",
      "name": "NeoHomeo",
      "legalName": "NeoHomeo",
      "alternateName": ["Neo Homeo", "NeoHomeo.com", "NeoHomeo.in"],
      "slogan": "Homeopathic. Anywhere. Anytime.",
      "description": "NeoHomeo is an AI-powered digital platform that connects patients across India with verified, licensed homeopathic doctors for online consultations, AI-assisted health assessments, and personalised remedy delivery.",
      "url": "https://neohomeo.com",
      "logo": {
        "@type": "ImageObject",
        "@id": "https://neohomeo.com/#logo",
        "url": "https://neohomeo.com/og-image.png",
        "width": 1200,
        "height": 630,
        "caption": "NeoHomeo"
      },
      "image": "https://neohomeo.com/og-image.png",
      "medicalSpecialty": "Homeopathic",
      "foundingDate": "2025",
      "areaServed": {
        "@type": "Country",
        "name": "India",
        "@id": "https://www.wikidata.org/wiki/Q668"
      },
      "knowsAbout": [
        "Homeopathy",
        "Online Medical Consultation",
        "AI Health Assessment",
        "PCOS Treatment",
        "Skin Disease Treatment",
        "Migraine Treatment",
        "Thyroid Treatment",
        "Hair Loss Treatment",
        "Allergy Treatment"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "NeoHomeo Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Health Assessment", "description": "Free AI-powered symptom assessment with Dr. Neo before your consultation." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Online Homeopathic Consultation", "description": "Secure video or audio consultation with a verified BHMS homeopathic doctor." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Medicine Delivery", "description": "Personalised homeopathic remedy kits delivered to your doorstep across India." } }
        ]
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+91-97046-40098",
          "contactType": "customer support",
          "email": "connect@neohomeo.com",
          "availableLanguage": ["English", "Hindi", "Telugu"],
          "contactOption": "TollFree"
        }
      ],
      "sameAs": [
        "https://x.com/neohomeo",
        "https://instagram.com/neohomeo",
        "https://linkedin.com/company/neohomeo",
        "https://neohomeo.in"
      ]
    }
    </script>

    <!-- ── JSON-LD: WebSite with Sitelinks Searchbox ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://neohomeo.com/#website",
      "name": "NeoHomeo",
      "alternateName": "NeoHomeo — AI-Powered Homeopathy",
      "url": "https://neohomeo.com",
      "publisher": { "@id": "https://neohomeo.com/#organization" },
      "inLanguage": ["en", "hi", "te"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://neohomeo.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── JSON-LD: WebPage (Homepage) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "@id": "https://neohomeo.com/#webpage",
      "url": "https://neohomeo.com/",
      "name": "NeoHomeo — AI-Powered Homeopathy Consultations Online",
      "isPartOf": { "@id": "https://neohomeo.com/#website" },
      "about": { "@id": "https://neohomeo.com/#organization" },
      "description": "NeoHomeo connects you with verified homeopathic doctors through AI-assisted assessments. Free assessment, online consultations, doorstep delivery.",
      "inLanguage": "en",
      "speakable": {
        "@type": "SpeakableSpecification",
        "cssSelector": ["h1", ".hero-speakable"]
      },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "NeoHomeo", "item": "https://neohomeo.com/" }
        ]
      }
    }
    </script>

    <!-- ── JSON-LD: FAQPage ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is NeoHomeo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NeoHomeo is an AI-powered online platform that connects patients with verified, licensed homeopathic doctors in India. It uses an AI assistant called Dr. Neo to take your health history and match you with the right practitioner."
          }
        },
        {
          "@type": "Question",
          "name": "Is NeoHomeo real homeopathy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. NeoHomeo connects you with licensed BHMS practitioners who practice classical and modern homeopathic approaches. All doctors are verified before appearing on the platform."
          }
        },
        {
          "@type": "Question",
          "name": "Is the AI on NeoHomeo diagnosing me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Dr. Neo only collects and structures your health information. Licensed doctors interpret your case and decide next steps. NeoHomeo is not a diagnostic tool."
          }
        },
        {
          "@type": "Question",
          "name": "How are doctors verified on NeoHomeo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every clinician on NeoHomeo passes document review, identity checks, and an operations audit before their profile is published publicly."
          }
        },
        {
          "@type": "Question",
          "name": "Does NeoHomeo deliver medicines?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. After a valid prescription from your NeoHomeo doctor, logistics partners dispatch tracked homeopathic remedy kits to your doorstep anywhere in India."
          }
        },
        {
          "@type": "Question",
          "name": "How much does a NeoHomeo consultation cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The AI assessment on NeoHomeo is completely free. Doctor consultation fees vary by practitioner and are shown on each doctor's profile. The assessment is free."
          }
        }
      ]
    }
    </script>

    <!-- ── Fonts ── -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
