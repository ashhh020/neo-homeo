<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary meta ── -->
    <title>NeoHomeo — AI-Powered Homeopathy Consultations Online</title>
    <meta name="description" content="Connect with verified homeopathic doctors through AI-assisted assessments. NeoHomeo matches your symptoms and lifestyle to the right physician for personalised care — from your phone or laptop." />
    <meta name="keywords" content="homeopathy online, homeopathic doctor, online homeopathy consultation, AI health assessment, Dr Neo, NeoHomeo, homeopathy India, BHMS doctor" />
    <meta name="author" content="NeoHomeo" />
    <meta name="theme-color" content="#0d9488" />

    <!-- ── Canonical & hreflang ── -->
    <link rel="canonical" href="https://neohomeo.com/" />
    <link rel="alternate" hreflang="en"    href="https://neohomeo.com/" />
    <link rel="alternate" hreflang="en-IN" href="https://neohomeo.in/" />
    <link rel="alternate" hreflang="x-default" href="https://neohomeo.com/" />

    <!-- ── Favicon & icons ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Preload critical assets ── -->
    <link rel="preload" as="image" href="/hero-doctors.png" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="NeoHomeo" />
    <meta property="og:url"         content="https://neohomeo.com/" />
    <meta property="og:title"       content="NeoHomeo — AI-Powered Homeopathy Consultations Online" />
    <meta property="og:description" content="AI-assisted intake. Verified BHMS doctors. Personalised remedies delivered to your door. Book your homeopathy consultation online." />
    <meta property="og:image"       content="https://neohomeo.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@neohomeo" />
    <meta name="twitter:title"       content="NeoHomeo — AI-Powered Homeopathy Consultations Online" />
    <meta name="twitter:description" content="AI-assisted intake. Verified BHMS doctors. Personalised remedies delivered to your door." />
    <meta name="twitter:image"       content="https://neohomeo.com/og-image.png" />

    <!-- ── JSON-LD: Organisation ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "NeoHomeo",
      "url": "https://neohomeo.com",
      "logo": "https://neohomeo.com/favicon.svg",
      "description": "AI-powered digital platform connecting patients with verified homeopathic doctors for online consultations and personalised treatment.",
      "medicalSpecialty": "Homeopathic",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-97046-40098",
        "contactType": "customer support",
        "email": "connect@neohomeo.com",
        "availableLanguage": ["English", "Hindi", "Telugu"]
      },
      "sameAs": [
        "https://x.com/neohomeo",
        "https://instagram.com/neohomeo",
        "https://linkedin.com/company/neohomeo"
      ],
      "areaServed": {
        "@type": "Country",
        "name": "India"
      }
    }
    </script>

    <!-- ── JSON-LD: WebSite (enables Google Sitelinks Searchbox) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NeoHomeo",
      "url": "https://neohomeo.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://neohomeo.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── JSON-LD: FAQPage ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is this real homeopathy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. NeoHomeo connects you with licensed practitioners who practice classical and modern homeopathic approaches."
          }
        },
        {
          "@type": "Question",
          "name": "Is AI diagnosing me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Dr. Neo only collects and structures information. Licensed doctors interpret your case and decide next steps."
          }
        },
        {
          "@type": "Question",
          "name": "Are doctors verified?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every clinician passes document review, identity checks, and an operations audit before appearing publicly."
          }
        },
        {
          "@type": "Question",
          "name": "How are medicines delivered?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After a valid prescription, logistics partners dispatch tracked kits to your doorstep."
          }
        },
        {
          "@type": "Question",
          "name": "How long do treatments take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Homeopathy is individualized; your doctor sets realistic milestones and follow-up cadence."
          }
        }
      ]
    }
    </script>

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
